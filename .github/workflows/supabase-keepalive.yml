name: Supabase Keep-Alive Pulse (Anti-Pause)

on:
  schedule:
    # Run every 3 days at 06:00 UTC (12:00 PM BST) to prevent Supabase 7-day inactivity pause
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  keepalive:
    name: Supabase Anti-Pause Heartbeat
    runs-on: ubuntu-latest

    steps:
      - name: Ping Vercel Keep-Alive Endpoint
        run: |
          echo "Sending Keep-Alive Pulse to Vercel Endpoint..."
          HTTP_STATUS=$(curl -s -o vercel_response.json -w "%{http_code}" -m 30 "https://innbox.qweekbd.com/api/cron/keep-alive" || echo "failed")
          echo "Vercel HTTP Status: $HTTP_STATUS"
          if [ -f vercel_response.json ]; then
            cat vercel_response.json
          fi

      - name: Direct Supabase Database Activity Heartbeat (Backup)
        run: |
          echo "Executing direct Supabase REST API Activity Pulse..."
          SUPABASE_URL="https://zmxrghnklvvkvrizztvx.supabase.co"
          SUPABASE_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          
          # Fallback to public anon key if secret not explicitly configured in GitHub Secrets
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpteHJnaG5rbHZ2a3ZyaXp6dHZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwOTg1MTEsImV4cCI6MjEwNjY3NDUxMX0.bOn7TBT9ZIEkeUaIOAq1RdATI6CdNMSilHc1HsbsOjs"
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 1. Direct READ (Select from products)
          echo "1. Performing READ on products..."
          READ_CODE=$(curl -s -o read_res.json -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/products?select=id,title&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "READ HTTP Status: $READ_CODE"

          # 2. Direct WRITE (Heartbeat update on store_settings)
          SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          if [ -z "$SERVICE_KEY" ]; then
            SERVICE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpteHJnaG5rbHZ2a3ZyaXp6dHZ4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MTA5ODUxMSwiZXhwIjoyMTA2Njc0NTExfQ.oGIe812-8avvMBd7do2Zdz_JUUfQMx7_rK7cjWI3mQY"
          fi

          SETTING_PAYLOAD="[{\"key\":\"last_keep_alive_ping\",\"value\":{\"timestamp\":\"$TIMESTAMP\",\"source\":\"github_actions\"}}]"
          WRITE_CODE=$(curl -s -o write_res.json -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/store_settings" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "$SETTING_PAYLOAD")
          echo "WRITE store_settings Status: $WRITE_CODE"

          # 3. Direct WRITE on keep_alive_logs (if table exists)
          LOG_PAYLOAD="{\"pinged_at\":\"$TIMESTAMP\",\"source\":\"github_actions\",\"status\":\"active\",\"meta\":{\"runner\":\"ubuntu-latest\"}}"
          curl -s -o /dev/null -X POST "$SUPABASE_URL/rest/v1/keep_alive_logs" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "$LOG_PAYLOAD" || true

          echo "✅ Supabase database keep-alive pulse completed successfully!"
